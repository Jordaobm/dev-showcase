- text: Desenvolvedor de Software Pleno Fullstack
- heading "Jordão Beghetto Massariol" [level=1]
- paragraph: "Sou desenvolvedor de software fullstack pleno há pouco mais de cinco anos e cheguei à liderança técnica do meu time aos poucos, ganhando a confiança da equipe no dia a dia. Ao longo desses anos, passei por uma variedade de projetos: rebuilds de sistemas legados, sustentação de longo prazo, CRMs, marketplaces, aplicativos de saúde e portais corporativos com IA aplicada, incluindo um sistema de saúde pública com TDD e auditoria via Spring AOP e uma plataforma financeira digital com lançamento em rollout controlado. Atuo com Java, Spring Boot, Node.js, React e TypeScript. Hoje, meu foco está no desenvolvimento de aplicações fullstack."
